# Blueprint de Render de FestivalTrack: backend (NestJS + Prisma) y portal web (sitio estático de Vite).
# Render → New → Blueprint → elegir este repositorio. Las variables con "sync: false"
# se piden en el panel al crear el servicio (valores de tu .env; nunca se suben a git).
services:
  - type: web
    name: festivaltrack-backend
    runtime: node
    plan: free
    region: oregon
    rootDir: festivaltrack-backend
    # --include=dev: con NODE_ENV=production npm omitiría @nestjs/cli y prisma, que se usan al compilar.
    # migrate deploy aplica solo migraciones pendientes (nunca migrate dev contra Neon).
    buildCommand: npm ci --include=dev && npx prisma generate && npm run build && npx prisma migrate deploy
    startCommand: npm run start:prod
    healthCheckPath: /api/v1/eventos
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: JWT_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        sync: false
      - key: ANTHROPIC_WORKSPACE_ID
        sync: false
      # Origen exacto del portal web (CORS). Si Render le asigna otra URL al sitio, cámbiala aquí.
      - key: FRONTEND_URL
        value: https://festivaltrack-web.onrender.com

  # Portal web: sitio estático. Aquí no corre `serve`, así que las cabeceras de seguridad y el
  # fallback de SPA de festivaltrack-web/public/serve.json se declaran en este archivo.
  - type: web
    name: festivaltrack-web
    runtime: static
    rootDir: festivaltrack-web
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Vite la incrusta al compilar: si cambia la URL del backend hay que volver a desplegar.
      - key: VITE_API_URL
        value: https://festivaltrack-backend.onrender.com/api/v1
    headers:
      # Misma política que serve.json. El origen del backend aparece en connect-src (API), img-src
      # (fotos y portadas de /uploads) y media-src (audio de /uploads).
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob: https://tile.openstreetmap.org https://festivaltrack-backend.onrender.com https://images.unsplash.com; media-src 'self' blob: https://festivaltrack-backend.onrender.com https://www.soundhelix.com; font-src 'self'; connect-src 'self' https://festivaltrack-backend.onrender.com https://routing.openstreetmap.de; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: geolocation=(self), camera=(), microphone=(), payment=(), usb=()
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
      - path: /*
        name: Cross-Origin-Opener-Policy
        value: same-origin
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /index.html
        name: Cache-Control
        value: no-cache
    routes:
      # Las rutas de React Router (/events, /mis-boletos…) no existen como archivos.
      - type: rewrite
        source: /*
        destination: /index.html
