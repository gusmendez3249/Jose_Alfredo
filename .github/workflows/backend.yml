# CI del backend NestJS: compila TypeScript y corre las pruebas unitarias en cada PR.
name: Backend CI

on:
  pull_request:
    branches: [develop, main]
    paths:
      - 'festivaltrack-backend/**'
      - '.github/workflows/backend.yml'
  push:
    branches: [develop, main]
    paths:
      - 'festivaltrack-backend/**'
      - '.github/workflows/backend.yml'
  workflow_dispatch:

jobs:
  test:
    name: Compilar y probar backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: festivaltrack-backend
    env:
      # Valor de prueba: las pruebas unitarias no se conectan a la base de datos real.
      JWT_SECRET: ci-test-secret
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: festivaltrack-backend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Generar cliente de Prisma
        run: npx prisma generate

      - name: Verificar tipos (TypeScript)
        run: npx tsc -p tsconfig.build.json --noEmit

      - name: Pruebas unitarias (Jest)
        run: npx jest --ci
