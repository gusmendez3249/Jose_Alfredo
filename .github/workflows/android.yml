# CI de la app Android: compila el APK de depuración en cada PR y lo guarda como artefacto descargable.
name: Android CI

on:
  pull_request:
    branches: [develop, main]
    paths-ignore:
      - 'festivaltrack-backend/**'
      - 'festivaltrack-web/**'
      - 'docs/**'
      - '**/*.md'
  push:
    branches: [develop, main]
    paths-ignore:
      - 'festivaltrack-backend/**'
      - 'festivaltrack-web/**'
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

jobs:
  build:
    name: Compilar APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar APK de la app móvil
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon -Dorg.gradle.jvmargs=-Xmx4g

      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: festivaltrack-app-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
