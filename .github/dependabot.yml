# Dependabot revisa cada semana las dependencias y abre PRs con parches y versiones menores.
# Las versiones mayores (Kotlin, Prisma, ESLint, Gradle...) piden cambios de código y se hacen a propósito (#91).
version: 2
updates:
  - package-ecosystem: npm
    directory: /festivaltrack-backend
    schedule:
      interval: weekly
    target-branch: develop
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /festivaltrack-web
    schedule:
      interval: weekly
    target-branch: develop
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    target-branch: develop
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # Requieren Kotlin 2.2+ o compileSdk 36 (el proyecto usa Kotlin 2.0.21 y AGP 8.7.3): se suben al migrar Kotlin/AGP.
      - dependency-name: "androidx.camera:*"
        versions: [">= 1.5.0"]
      - dependency-name: "org.jetbrains.kotlinx:kotlinx-serialization-json"
        versions: [">= 1.7.0"]
      - dependency-name: "com.google.android.gms:play-services-location"
        versions: [">= 21.4.0"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    target-branch: develop
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
