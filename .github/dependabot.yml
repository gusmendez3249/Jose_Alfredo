# Dependabot revisa cada semana las dependencias y abre PRs con parches y versiones menores.
# Las versiones mayores (Kotlin, Prisma, ESLint, Gradle...) piden cambios de código y se hacen a propósito (#91).
version: 2
updates:
  - package-ecosystem: npm
    directory: /festivaltrack-backend
    schedule:
      interval: weekly
    target-branch: develop
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /festivaltrack-web
    schedule:
      interval: weekly
    target-branch: develop
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    target-branch: develop
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    target-branch: develop
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
